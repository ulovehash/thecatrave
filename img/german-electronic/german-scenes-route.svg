<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">German electronic music by city and era</title>
  <desc id="desc">A schematic route connecting Cologne's electronic studio, Düsseldorf electronic pop, West Berlin sequencer music, Frankfurt techno and trance, and post-Wall Berlin techno.</desc>
  <rect width="1200" height="700" fill="#f1eee7"/>
  <style>
    .mono{font-family:"Space Mono",monospace;text-transform:uppercase;letter-spacing:1px}.sans{font-family:"Satoshi",Arial,sans-serif}.line{fill:none;stroke:#0a0a0a;stroke-width:4}.node{fill:#9ff5ed;stroke:#0a0a0a;stroke-width:4}.date{font-size:22px;font-weight:700}.city{font-size:38px;font-weight:700;letter-spacing:-1px}.note{font-size:22px}.tag{font-size:18px;font-weight:700}.brand{font-size:18px;font-weight:700;fill:#b83c10}
  </style>
  <text x="60" y="62" class="mono tag">A schematic, not a family tree</text>
  <text x="1140" y="62" text-anchor="end" class="mono brand">thecatrave</text>
  <path class="line" d="M150 320 C240 215 295 205 385 280 S545 405 620 315 S770 190 850 285 S1010 425 1080 325"/>
  <g transform="translate(60 245)">
    <rect class="node" width="210" height="170" rx="3"/>
    <text x="20" y="36" class="mono date">1951</text>
    <text x="20" y="82" class="sans city">Cologne</text>
    <text x="20" y="117" class="sans note">WDR studio</text>
    <text x="20" y="146" class="sans note">Stockhausen</text>
  </g>
  <g transform="translate(285 120)">
    <rect class="node" width="220" height="170" rx="3"/>
    <text x="20" y="36" class="mono date">1970s</text>
    <text x="20" y="82" class="sans city">Düsseldorf</text>
    <text x="20" y="117" class="sans note">Kraftwerk, NEU!</text>
    <text x="20" y="146" class="sans note">electronic pop</text>
  </g>
  <g transform="translate(505 330)">
    <rect class="node" width="225" height="170" rx="3"/>
    <text x="20" y="36" class="mono date">1970s</text>
    <text x="20" y="82" class="sans city">West Berlin</text>
    <text x="20" y="117" class="sans note">Tangerine Dream</text>
    <text x="20" y="146" class="sans note">sequencer music</text>
  </g>
  <g transform="translate(730 110)">
    <rect class="node" width="220" height="180" rx="3"/>
    <text x="20" y="36" class="mono date">1980s-90s</text>
    <text x="20" y="82" class="sans city">Frankfurt</text>
    <text x="20" y="117" class="sans note">Technoclub, Omen</text>
    <text x="20" y="146" class="sans note">techno and trance</text>
  </g>
  <g transform="translate(930 340)">
    <rect class="node" width="220" height="185" rx="3"/>
    <text x="20" y="36" class="mono date">1989 onward</text>
    <text x="20" y="82" class="sans city">Berlin</text>
    <text x="20" y="117" class="sans note">Detroit alliance</text>
    <text x="20" y="146" class="sans note">Tresor, minimal</text>
  </g>
  <text x="60" y="635" class="sans note">The line marks changing infrastructure and exchange. It does not claim that one city invented the next.</text>
</svg>

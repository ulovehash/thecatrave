<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Bass music : un terme, des histoires différentes</title>
  <desc id="desc">Un index visuel des histoires de la bass music à Kingston, Miami, en Grande-Bretagne, à Los Angeles, Chicago et Durban.</desc>
  <style>
    .sans{font-family:Arial,Helvetica,sans-serif;fill:#0a0a0a}.mono{font-family:"Courier New",monospace;fill:#0a0a0a;font-weight:700}.city{font-size:44px;font-weight:800;letter-spacing:-1px}.date{font-size:20px}.copy{font-size:23px}.small{font-size:17px;letter-spacing:1px}.line{stroke:#0a0a0a;stroke-width:3}.box{stroke:#0a0a0a;stroke-width:3}
  </style>
  <rect width="1400" height="900" fill="#f1eee7"/>
  <text class="mono small" x="72" y="64">THECATRAVE / GUIDE VISUEL 01</text>
  <text class="sans" x="70" y="145" font-size="72" font-weight="800" letter-spacing="-3">BASS MUSIC</text>
  <text class="sans" x="70" y="207" font-size="50" font-weight="700" letter-spacing="-2">UN TERME, DES HISTOIRES DIFFÉRENTES.</text>
  <line class="line" x1="70" y1="245" x2="1330" y2="245"/>

  <g transform="translate(70 285)">
    <rect class="box" width="390" height="220" fill="#95ebe4"/>
    <text class="mono date" x="28" y="42">Années 1950–70</text>
    <text class="sans city" x="28" y="98">KINGSTON</text>
    <text class="sans copy" x="28" y="144">Sound systems / Dub</text>
    <text class="sans copy" x="28" y="177">Versions / Espace grave</text>
  </g>
  <g transform="translate(505 285)">
    <rect class="box" width="390" height="220" fill="#ffdf4d"/>
    <text class="mono date" x="28" y="42">Années 1980–90</text>
    <text class="sans city" x="28" y="98">MIAMI</text>
    <text class="sans copy" x="28" y="144">Électro / Hip-hop / 808</text>
    <text class="sans copy" x="28" y="177">Voitures / Son mobile</text>
  </g>
  <g transform="translate(940 285)">
    <rect class="box" width="390" height="220" fill="#ff5a36"/>
    <text class="mono date" x="28" y="42">1988–années 2010</text>
    <text class="sans city" x="28" y="98" style="font-size:30px">GRANDE-BRETAGNE</text>
    <text class="sans copy" x="28" y="144">Rave / Radios pirates</text>
    <text class="sans copy" x="28" y="177">Jungle / Garage / Dubstep</text>
  </g>

  <g transform="translate(70 540)">
    <rect class="box" width="390" height="220" fill="#d8ff54"/>
    <text class="mono date" x="28" y="42">Années 1990–2010</text>
    <text class="sans city" x="28" y="98">LOS ANGELES</text>
    <text class="sans copy" x="28" y="144">D&amp;B / Scène beat</text>
    <text class="sans copy" x="28" y="177">Dubstep / Soirées hebdo</text>
  </g>
  <g transform="translate(505 540)">
    <rect class="box" width="390" height="220" fill="#cab6ff"/>
    <text class="mono date" x="28" y="42">Années 1990–2010</text>
    <text class="sans city" x="28" y="98">CHICAGO</text>
    <text class="sans copy" x="28" y="144">Ghetto house / Footwork</text>
    <text class="sans copy" x="28" y="177">Crews de danse / Battles</text>
  </g>
  <g transform="translate(940 540)">
    <rect class="box" width="390" height="220" fill="#ffc7d7"/>
    <text class="mono date" x="28" y="42">Années 2010→</text>
    <text class="sans city" x="28" y="98">DURBAN</text>
    <text class="sans copy" x="28" y="144">Gqom / Taxis</text>
    <text class="sans copy" x="28" y="177">Réseaux MP3 / Clubs</text>
  </g>

  <line class="line" x1="70" y1="805" x2="1330" y2="805"/>
  <text class="mono small" x="70" y="846">HISTOIRES PARALLÈLES RELIÉES PAR LES DISQUES, LA MIGRATION, LES CLUBS ET INTERNET</text>
  <text class="mono small" x="1170" y="876">thecatrave</text>
</svg>

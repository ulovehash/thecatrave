<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="Two diagrams comparing what following an artist gives you against what following a producer gives you. Following an artist leads to that artist's own back catalogue. Following a producer leads sideways to every artist they worked with, and on to the labels those artists released on.">
<style>
  .box{fill:#f1eee7;stroke:#0a0a0a;stroke-width:2}
  .boxa{fill:#ff5a36;stroke:#0a0a0a;stroke-width:2}
  .t{font:600 16px "Space Mono",ui-monospace,monospace;fill:#0a0a0a}
  .th{font:700 20px "Space Mono",ui-monospace,monospace;fill:#0a0a0a;letter-spacing:.04em}
  .ts{font:400 13px "Space Mono",ui-monospace,monospace;fill:#0a0a0a;opacity:.7}
  .ln{stroke:#0a0a0a;stroke-width:2;fill:none}
</style>

<text x="60" y="44" class="th">DEM KÜNSTLER FOLGEN</text>
<rect x="60" y="80" width="220" height="48" rx="2" class="boxa"/><text x="78" y="110" class="t">ein Künstler</text>
<path d="M170 128 L170 170" class="ln" marker-end="url(#b)"/>
<rect x="60" y="172" width="220" height="48" rx="2" class="box"/><text x="78" y="202" class="t">seine Platten</text>
<text x="60" y="256" class="ts">die meist klingen</text>
<text x="60" y="278" class="ts">wie dieser Künstler.</text>

<line x1="390" y1="24" x2="390" y2="400" stroke="#0a0a0a" stroke-width="1" stroke-dasharray="4 6" opacity=".4"/>

<text x="500" y="44" class="th">DEM PRODUZENTEN FOLGEN</text>
<rect x="610" y="80" width="220" height="48" rx="2" class="boxa"/><text x="628" y="110" class="t">ein Produzent</text>

<path d="M720 128 L720 150 L565 150 L565 170" class="ln" marker-end="url(#b)"/>
<path d="M720 128 L720 170" class="ln" marker-end="url(#b)"/>
<path d="M720 128 L720 150 L875 150 L875 170" class="ln" marker-end="url(#b)"/>

<rect x="500" y="172" width="130" height="44" rx="2" class="box"/><text x="518" y="200" class="t">Künstler A</text>
<rect x="655" y="172" width="130" height="44" rx="2" class="box"/><text x="673" y="200" class="t">Künstler B</text>
<rect x="810" y="172" width="130" height="44" rx="2" class="box"/><text x="828" y="200" class="t">Künstler C</text>

<path d="M565 216 L565 240 L718 240" class="ln"/>
<path d="M875 216 L875 240 L722 240" class="ln"/>
<path d="M720 216 L720 264" class="ln" marker-end="url(#b)"/>

<rect x="610" y="266" width="220" height="48" rx="2" class="box"/><text x="628" y="296" class="t">ihre Labels</text>
<text x="500" y="352" class="ts">und jedes Label ist ein weiterer</text>
<text x="500" y="374" class="ts">Katalog, den jemand anderes</text>
<text x="500" y="396" class="ts">schon für dich gefiltert hat.</text>

<defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0a0a0a"/></marker></defs>
</svg>

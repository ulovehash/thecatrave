name: refresh selector catalogue

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild the catalogue from channel RSS feeds
        run: |
          node scripts/fetch-sets.mjs
          node build-selector.mjs

      - name: Commit if the catalogue changed
        run: |
          if [ -n "$(git status --porcelain selector-data.json selector.html)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add selector-data.json selector.html
            git commit -m "Refresh selector catalogue"
            git push
          else
            echo "No change."
          fi

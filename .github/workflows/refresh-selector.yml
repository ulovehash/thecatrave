name: refresh selector catalogue

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild the catalogue from the YouTube Data API
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-sets.mjs

      - name: Tag genres from Last.fm
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: node scripts/enrich-genres.mjs

      - name: Rebuild the page
        run: node build-selector.mjs

      - name: Commit if the catalogue changed
        run: |
          if [ -n "$(git status --porcelain selector-data.json selector.html selector-genres-cache.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add selector-data.json selector.html selector-genres-cache.json
            git commit -m "Refresh selector catalogue"
            git push
          else
            echo "No change."
          fi
